########[CD PIPELINE FLOW]########
# Run ci_succeed:                #
#   | failure ~> stop.           #
#   | pass:                      #
#       Run create_release:      #
#          | failure ~> stop.    #
#          | pass:               #
#             Run publish.       #
##################################
# Requiered Github secrets:      #
#   - GITHUB_TOKEN               #
#   - PYPI_TOKEN                 #
##################################

name: CD

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  ci_succeed:
    name: Check CI Status
    runs-on: ubuntu-latest
    steps:
      - uses: hadialqattan/relies-on@v1.0.0
        with:
          workflow: CI

  create_release:
    name: Create Release
    needs: ci_succeed
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get version from tag
        id: tag_name
        run: |
          echo "current_version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get Changelog Entry
        id: changelog_reader
        uses: mindsers/changelog-reader-action@v2
        with:
          version: ${{ steps.tag_name.outputs.current_version }}
          path: ./docs/CHANGELOG.md

      - name: Create Release
        # This pulls from the "Get Changelog Entry" step above,
        # referencing it's ID to get its outputs object.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.changelog_reader.outputs.version }}
          NOTES: ${{ steps.changelog_reader.outputs.changes }}
          PRERELEASE: ${{ steps.changelog_reader.outputs.status == 'prereleased' }}
          DRAFT: ${{ steps.changelog_reader.outputs.status == 'unreleased' }}
        run: |
          gh release create "v$VERSION" --title "v$VERSION" --notes "$NOTES" \
            --prerelease="$PRERELEASE" --draft="$DRAFT"
        shell: bash

  publish:
    name: Build & Publish
    needs: [ci_succeed, create_release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and publish to pypi
        uses: JRubics/poetry-publish@v2.1
        with:
          pypi_token: ${{ secrets.PYPI_TOKEN }}
